name: Aplicación Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      REQUIRE_GUI_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-build.txt
      - name: Ejecutar pruebas en Windows
        run: python -m unittest discover -s tests -v
      - name: Construir aplicación
        run: python -m PyInstaller --noconfirm --clean packaging/PlanillasPDF.spec
      - name: Probar el ejecutable con rutas que contienen espacios y tildes
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'Prueba aplicación Windows'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item dist/PlanillasPDF -Destination $folder -Recurse
          $exe = Join-Path $folder 'PlanillasPDF/PlanillasPDF.exe'
          $report = Join-Path $folder 'resultado.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', "`"$report`"") -WorkingDirectory $folder -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Falló la prueba del ejecutable.' }
          if (!(Test-Path $report)) { throw 'El ejecutable no generó el informe.' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (!$result.ok) { throw ($result | ConvertTo-Json) }
          Get-Content $report
      - name: Incluir instrucciones
        run: Copy-Item docs/WINDOWS.md dist/PlanillasPDF/LEEME.md
      - name: Guardar aplicación descargable
        uses: actions/upload-artifact@v4
        with:
          name: PlanillasPDF-Windows-x64
          path: dist/PlanillasPDF/
          if-no-files-found: error
          retention-days: 14
